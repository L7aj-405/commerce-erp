acts"}]},{"id":"integrations","label":"Intégrations","icon":"plug","children":[{"label":"WooCommerce","href":"/integrations/woocommerce"},{"label":"Stock WooCommerce","href":"/integrations/woocommerce/stock-tasks"}]},{"id":"admin","label":"Administration","icon":"shield","children":[{"label":"Utilisateurs & accès","href":"/organizations/:organizationId/users-access"}]},{"id":"settings","label":"Paramètres","icon":"settings","children":[{"label":"Organisation / société","href":"/document-profile"},{"label":"Studio PDF","href":"/document-profile/studio"},{"label":"Documents · Devis","href":"/quotation-settings"},{"label":"Cachet de l’entreprise","href":"/document-stamp"},{"label":"Politique de retour","href":"/return-policy"},{"label":"Email / SMTP","href":"/email-settings"},{"label":"Sauvegardes & restauration","href":"/organization-backups"},{"label":"Taxes (TVA)","href":"/catalog/tax-rates"}]}];
const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',bag:'<path d="M4 8h16l-1.3 13H5.3L4 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',box:'<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="M3 7v10l9 5 9-5V7M12 12v10"/>',cart:'<circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M2 3h2l3 13h13l2-10H5"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20V8"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8M20 21v-2a6 6 0 0 0-3-5"/>',plug:'<path d="M8 3v6M16 3v6M6 9h12v4a6 6 0 0 1-12 0V9ZM12 19v3"/>',shield:'<path d="M12 2 21 6v6c0 5-4 9-9 10-5-1-9-5-9-10V6l9-4Z"/><path d="m9 12 2 2 4-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-2-2-4-3 1a7 7 0 0 0-2-1l-1-3h-4l-1 3a7 7 0 0 0-2 1l-3-1-2 4 2 2a7 7 0 0 0 0 2l-2 2 2 4 3-1a7 7 0 0 0 2 1l1 3h4l1-3a7 7 0 0 0 2-1l3 1 2-4-2-2a7 7 0 0 0 .1-1Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>',moon:'<path d="M20 15.2A9 9 0 0 1 8.8 4a9 9 0 1 0 11.2 11.2Z"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',menu:'<path d="M3 7h18M3 12h18M3 17h18"/>',file:'<path d="M5 2h9l5 5v15H5V2Z"/><path d="M14 2v5h5M8 13h8M8 17h8"/>',plus:'<path d="M12 5v14M5 12h14"/>',right:'<path d="M4 12h16m-7-7 7 7-7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',down:'<path d="m5 9 7 7 7-7"/>',up:'<path d="m5 15 7-7 7 7"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.grid}</svg>`}
let state={module:'dashboard',child:0,drawer:false,openGroups:new Set(['dashboard','sales']),theme:localStorage.getItem('10x-reference-theme')||'light',search:false,openNavMenu:null};
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const module=()=>NAV.find(m=>m.id===state.module)||NAV[0];
function setTheme(value){state.theme=value;document.documentElement.dataset.theme=value;localStorage.setItem('10x-reference-theme',value);$('themeToggle').innerHTML=icon(value==='dark'?'sun':'moon',19);$('themeToggle').title=value==='dark'?'Activer mode clair':'Activer mode sombre'}
function renderRail(){$('iconRail').innerHTML=`<button class="rail-btn" title="Tous les modules" aria-label="Tous les modules" data-open-drawer>${icon('grid',19)}</button><div class="rail-sep"></div>`+NAV.map(m=>`<button class="rail-btn ${m.id===state.module?'active':''}" title="${escapeHTML(m.label)}" aria-label="${escapeHTML(m.label)}" data-module="${m.id}">${icon(m.icon,19)}</button>`).join('');$('iconRail').querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>selectModule(b.dataset.module));$('iconRail').querySelector('[data-open-drawer]').onclick=()=>openDrawer()}
// Contextual navigation: curated shortcuts + semantic dropdowns. Every child stays reachable.
// This configuration affects presentation ONLY. The NAV registry remains the source of truth.
const NAV_PRESENTATION={
  dashboard:{direct:['Vue d’ensemble']},
  sales:{direct:['Point de vente','Commandes','Factures'],groups:[{label:'Documents',items:['Devis','Bons de livraison','Retours / Avoirs']}]},
  catalog:{direct:['Produits','État du stock'],groups:[{label:'Catalogue',items:['Catégories','Marques','Import produits','Articles hors stock']},{label:'Stock & logistique',items:['Mouvements de stock','Transferts','Demandes de transfert','Entrepôts']}]},
  purchases:{direct:['Approvisionnements','Fournisseurs'],groups:[{label:'Suivi',items:['Articles à cataloguer']}]},
  finance:{direct:['Vue d’ensemble','Créances'],groups:[{label:'Chiffre d’affaires',items:['Ventes','CA encaissé','Encaissements']},{label:'Gestion financière',items:['Facturation','Journal','Paiements','Comptes financiers']}]},
  clients:{direct:['Clients','Contacts']},integrations:{direct:['WooCommerce','Stock WooCommerce']},
  admin:{direct:['Utilisateurs & accès']},
  settings:{direct:['Organisation / société','Studio PDF'],groups:[{label:'Documents',items:['Documents · Devis','Cachet de l’entreprise','Politique de retour']},{label:'Configuration',items:['Email / SMTP','Sauvegardes & restauration','Taxes (TVA)']}]}
};
function dropdownHTML(label,items,m,idx,more=false){
  if(!items.length)return '';
  const key=`${m.id}:${idx}`;const open=state.openNavMenu===key;
  const selected=items.some(x=>x.i===state.child);
  return `<div class="nav-drop ${more?'more':''}"><button class="nav-drop-trigger ${selected?'active':''} ${open?'open':''}" aria-haspopup="menu" aria-expanded="${open}" data-nav-menu="${key}">${escapeHTML(label)}<span class="chevron">⌄</span></button>${open?`<div class="nav-popover" role="menu"><div class="nav-popover-heading">${escapeHTML(m.label)} · ${escapeHTML(label)}</div>${items.map(x=>`<button role="menuitem" class="${x.i===state.child?'active':''}" data-nav-page="${x.i}"><span>${escapeHTML(x.label)}</span>${x.i===state.child?'✓':''}</button>`).join('')}</div>`:''}</div>`;
}
function renderTabs(){
 const m=module(),conf=NAV_PRESENTATION[m.id]||{};
 const get=(names)=>names.map(label=>({label,i:m.children.findIndex(c=>c.label===label)})).filter(x=>x.i>=0);
 let direct=get(conf.direct||[]),groups=(conf.groups||[]).map(g=>({label:g.label,items:get(g.items)})).filter(g=>g.items.length);
 const accounted=new Set([...direct,...groups.flatMap(g=>g.items)].map(x=>x.i));
 let remaining=m.children.map((x,i)=>({label:x.label,i})).filter(x=>!accounted.has(x.i));
 // On narrower screens: keep the active page directly visible, at most two shortcuts.
 let limit=window.innerWidth<740?1:window.innerWidth<1100?1:window.innerWidth<1450?2:3;
 if(m.children.length<=3)limit=m.children.length;
 if(!direct.some(x=>x.i===state.child)&&!groups.some(g=>g.items.some(x=>x.i===state.child))){
    const active={label:m.children[state.child].label,i:state.child};direct=[active,...direct];remaining=remaining.filter(x=>x.i!==state.child);
 }
 // If a direct item gets moved to More due to width, it is still immediately accessible.
 const shown=direct.slice(0,limit),overflow=[...direct.slice(limit),...remaining];
 // On mobile, group dropdowns are folded into More, keeping the topbar to two actions.
 if(window.innerWidth<1250){overflow.push(...groups.flatMap(g=>g.items));groups=[];}
 const directHTML=shown.map(x=>`<button class="tab ${x.i===state.child?'active':''}" data-nav-page="${x.i}" title="${escapeHTML(m.children[x.i].href)}">${escapeHTML(x.label)}</button>`).join('');
 const groupHTML=groups.map((g,idx)=>dropdownHTML(g.label,g.items,m,'g'+idx)).join('');
 $('contextTabs').innerHTML=`<span class="nav-label" title="${escapeHTML(m.label)}">${escapeHTML(m.label)}</span><span class="nav-divider"></span>${directHTML}${groupHTML}${dropdownHTML('Plus',overflow,m,'more',true)}`;
 $('contextTabs').querySelectorAll('[data-nav-page]').forEach(b=>b.onclick=()=>{state.openNavMenu=null;selectChild(+b.dataset.navPage)});
 $('contextTabs').querySelectorAll('[data-nav-menu]').forEach(b=>b.onclick=()=>{const id=b.dataset.navMenu;state.openNavMenu=state.openNavMenu===id?null:id;renderTabs()});
}

function renderDrawer(){let q=$('menuSearch').value.trim().toLowerCase();$('drawerGroups').innerHTML=NAV.map(m=>{const children=m.children.filter(c=>!q||c.label.toLowerCase().includes(q)||m.label.toLowerCase().includes(q));if(q&&!children.length)return '';let open=q||state.openGroups.has(m.id)||m.id===state.module;return `<section class="group ${open?'open':''}" data-group="${m.id}"><button class="group-trigger" data-toggle="${m.id}" aria-expanded="${!!open}">${icon(m.icon,17)}<span>${escapeHTML(m.label)}</span>${icon('down',13)}</button><div class="group-items">${children.map(c=>{let i=m.children.indexOf(c);return `<button class="group-link ${m.id===state.module&&i===state.child?'active':''}" data-go="${m.id}:${i}" style="border:0;text-align:left;background:${m.id===state.module&&i===state.child?'var(--soft)':'transparent'};width:100%">${escapeHTML(c.label)}</button>`}).join('')}</div></section>`}).join('');$('drawerGroups').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggle;state.openGroups.has(id)?state.openGroups.delete(id):state.openGroups.add(id);renderDrawer()});$('drawerGroups').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let [id,i]=b.dataset.go.split(':');selectModule(id,+i);closeDrawer()})}
function openDrawer(){state.drawer=true;$('drawer').classList.add('open');$('drawerBackdrop').classList.add('open');$('drawer').setAttribute('aria-hidden','false');renderDrawer()};function closeDrawer(){state.drawer=false;$('drawer').classList.remove('open');$('drawerBackdrop').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')}
function selectModule(id,child=0){state.openNavMenu=null;state.module=id;state.child=child;state.openGroups.add(id);renderAll()};function selectChild(i){state.openNavMenu=null;state.child=i;renderAll()}
function toast(text){$('notice').textContent=text;$('notice').classList.add('visible');clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>$('notice').classList.remove('visible'),3100)}
const METRICS=[{label:'Produits',key:'product_count',icon:'box',route:'/catalog/products',display:'1 248'},{label:'Articles en stock',key:'stocked_item_count',icon:'grid',route:'/inventory/stock',display:'3 816'},{label:'Ventes aujourd’hui',key:'sales_today',icon:'bag',route:'/sales/orders',display:'28'},{label:'Paiements à recevoir',key:'payments_to_receive',icon:'chart',route:'/payments',display:'12 450 MAD'},{label:'Stock WooCommerce à mettre à jour',key:'woo_stock_tasks_pending',icon:'plug',route:'/integrations/woocommerce/stock-tasks',display:'13'},{label:'Articles à cataloguer',key:'out_of_stock_articles_pending',icon:'cart',route:'/procurement/out-of-stock-articles',display:'7'}];
function metricCard(m){return `<article class="card metric" title="Backend field: dashboard.${m.key}"><div class="metric-heading"><span>${escapeHTML(m.label)}</span><span class="metric-icon">${icon(m.icon,15)}</span></div><div class="metric-value">${escapeHTML(m.display)}</div><div class="metric-desc">Donnée illustrative · <code>${escapeHTML(m.key)}</code></div></article>`}
function renderDashboard(){return `<div class="content-layout"><div class="left-content"><div class="metric-grid">${METRICS.map(metricCard).join('')}</div><div class="workspace-grid"><section class="card overview-card"><div class="card-head"><div><h2 class="card-title">Vue d'activité</h2><p class="card-sub">Présentation visuelle indicative, sans données analytiques inventées</p></div><span class="small-button">Aperçu</span></div><div class="mini-chart"><svg viewBox="0 0 540 180" preserveAspectRatio="none"><path class="gridline" d="M0 36H540M0 72H540M0 108H540M0 144H540"/><path class="grapharea" d="M0 142 C45 132 55 150 90 122 S155 112 175 93 S240 115 270 82 S324 103 361 57 S416 66 455 39 S510 58 540 17 V180H0Z"/><path class="graphline" d="M0 142 C45 132 55 150 90 122 S155 112 175 93 S240 115 270 82 S324 103 361 57 S416 66 455 39 S510 58 540 17"/><circle class="graphdot" cx="361" cy="57" r="5"/></svg></div><div class="chart-legend"><span class="mini-legend"><i class="dot"></i> Chart placeholder</span><span>Connecter un endpoint réel si disponible</span></div></section><section class="card onboard-card"><div class="card-head"><div><h2 class="card-title">Bien démarrer</h2><p class="card-sub">Étapes du flux existant</p></div><span class="small-button">5 étapes</span></div><div class="checklist">${['Créer votre organisation','Créer votre premier magasin','Ajouter ou importer des produits','Enregistrer le stock initial','Réaliser votre première vente'].map((s,i)=>`<div class="check ${i<2?'done':''}"><span class="check-icon">${i<2?'✓':i+1}</span><span class="check-text">${escapeHTML(s)}</span></div>`).join('')}</div></section></div><section class="card table-card"><div class="table-head"><div><h2 class="card-title">Accès direct aux opérations</h2><p class="card-sub">Pages réelles du projet, navigation de démonstration</p></div><button class="small-button" data-select="sales:1">Voir les commandes →</button></div><div class="table-shell"><table><thead><tr><th>Module</th><th>Page</th><th>Route existante</th><th>Type</th></tr></thead><tbody>${[['Ventes','Commandes','/sales/orders'],['Catalogue','Produits','/catalog/products'],['Stocks','État du stock','/inventory/stock'],['Achats','Approvisionnements','/procurement'],['Finance','Vue d’ensemble','/finance']].map((a,i)=>`<tr><td><strong>${a[0]}</strong></td><td>${a[1]}</td><td><code style="color:var(--muted)">${a[2]}</code></td><td><span class="status ${i<2?'ok':'warn'}">Disponible</span></td></tr>`).join('')}</tbody></table></div></section></div><div class="right-content"><section class="card action-card"><div class="card-head"><div><h2 class="card-title">Actions rapides</h2><p class="card-sub">Basées sur les routes existantes</p></div>${icon('plus',18)}</div><div class="action-grid"><button class="action primary" data-select="sales:0">${icon('bag',20)} Nouvelle vente · POS</button><button class="action" data-select="purchases:0">${icon('cart',20)} Approvisionnement</button><button class="action" data-navigate="/catalog/products/create">${icon('box',20)} Ajouter produit</button><button class="action" data-select="clients:0">${icon('users',20)} Clients</button></div></section><section class="card alert-card"><div class="card-head"><div><h2 class="card-title">À surveiller</h2><p class="card-sub">Indicateurs présents dans l’ERP</p></div><span class="chip">2</span></div><div class="alert-list"><div class="alert" data-select="integrations:1"><span class="alert-icon">${icon('plug',17)}</span><div class="alert-text"><b>Stock WooCommerce</b><span>Tâches en attente</span></div>${icon('right',15)}</div><div class="alert" data-select="purchases:1"><span class="alert-icon">${icon('cart',17)}</span><div class="alert-text"><b>Articles à cataloguer</b><span>Suivi des approvisionnements</span></div>${icon('right',15)}</div></div></section><div class="card action-card"><h2 class="card-title">À propos de cette démo</h2><div class="hint">Le design et les interactions sont fonctionnels en HTML/CSS/JS. Les valeurs affichées sont <b>fictives</b>. Les liens simulent la navigation afin que Claude Code intègre ensuite les vraies routes, permissions et props Inertia.</div></div></div></div>`}
function renderModulePage(){const m=module(),c=m.children[state.child];return `<div class="content-layout"><div class="left-content"><section class="card overview-card"><div class="card-head"><div><h2 class="card-title">${escapeHTML(c.label)}</h2><p class="card-sub">Espace de travail du module ${escapeHTML(m.label)}</p></div><button class="top-action" data-create>＋ Nouvelle opération</button></div><div style="display:flex;gap:8px;align-items:center;margin:21px 0 12px"><button class="small-button" id="demoFilter">☷ Filtres</button><input style="margin-left:auto;min-width:0;width:min(270px,100%);padding:11px 13px;background:var(--soft);border:1px solid var(--line);border-radius:11px;color:var(--ink)" placeholder="Rechercher dans ${escapeHTML(c.label)}…"></div><div class="table-shell"><table><thead><tr><th>Référence</th><th>Intitulé</th><th>Date</th><th>Statut</th><th>Action</th></tr></thead><tbody>${[1,2,3,4,5].map((n,i)=>`<tr><td><strong>${m.id.toUpperCase()}-${String(n).padStart(4,'0')}</strong></td><td>Exemple ${n} · ${escapeHTML(c.label)}</td><td>12/11/2026</td><td><span class="status ${i%2===0?'ok':'warn'}">${i%2===0?'Actif':'En attente'}</span></td><td><button class="small-button" data-row="${n}">Afficher ↗</button></td></tr>`).join('')}</tbody></table></div><p class="reference-label">Données et interactions de démonstration — pas de backend connecté.</p></section><section class="card overview-card"><h2 class="card-title">Navigation contextuelle</h2><p class="card-sub" style="margin:8px 0 0">Change les onglets du header en cliquant sur une autre icône de module. Tu peux aussi ouvrir le drawer via le bord gauche.</p></section></div><div class="right-content"><section class="card action-card"><h2 class="card-title">Module actif</h2><div class="hint"><b>${escapeHTML(m.label)}</b><br>Page : ${escapeHTML(c.label)}<br>Route source : <code>${escapeHTML(c.href)}</code></div><button class="small-button" style="margin-top:12px;width:100%" data-open-drawer>Explorer le module</button></section><section class="card alert-card"><h2 class="card-title">Actions visibles</h2><p class="card-sub">Les actions prioritaires ne sont pas cachées en simples liens texte.</p><div class="action-grid" style="grid-template-columns:1fr"><button class="action primary" data-create>＋ Créer</button><button class="action" data-select="dashboard:0">${icon('grid',17)} Retour Dashboard</button></div></section></div></div>`}
function bindContent(){document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{let[id,i]=el.dataset.select.split(':');selectModule(id,+i);window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-navigate]').forEach(el=>el.onclick=()=>toast('Route réelle : '+el.dataset.navigate+' — liaison par Claude Code'));document.querySelectorAll('[data-create]').forEach(el=>el.onclick=()=>toast('Action de création : à raccorder au workflow ERP existant'));document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>toast('Ligne '+el.dataset.row+' : données de démonstration'));document.querySelectorAll('[data-open-drawer]').forEach(el=>el.onclick=openDrawer);let f=$('demoFilter');if(f)f.onclick=()=>toast('Filtres : à relier à chaque écran métier')}
function renderAll(){let m=module(),c=m.children[state.child];renderRail();renderTabs();renderDrawer();$('pageEyebrow').textContent=m.id==='dashboard'?'ESPACE DE TRAVAIL  /  ACCUEIL':`10xScale ERP  /  ${m.label.toUpperCase()}`;$('pageTitle').innerHTML=m.id==='dashboard'?'Bonjour, Yassine <span aria-hidden="true">✳</span>':escapeHTML(c.label);$('pageDescription').textContent=m.id==='dashboard'?'Un aperçu clair de vos opérations, sans distractions.':`Navigation contextuelle · ${m.label} · ${c.href}`;$('pageContent').innerHTML=m.id==='dashboard'?renderDashboard():renderModulePage();bindContent()}
function commandResults(q=''){let matches=NAV.flatMap(m=>m.children.map((c,i)=>({m,c,i}))).filter(x=>!q||(`${x.m.label} ${x.c.label}`).toLowerCase().includes(q.toLowerCase())).slice(0,16);$('commandResults').innerHTML=matches.map(x=>`<button class="command-result" data-command="${x.m.id}:${x.i}"><span>${escapeHTML(x.c.label)}</span><span style="color:var(--muted);font-size:11px">${escapeHTML(x.m.label)}</span></button>`).join('')||'<p style="padding:12px;color:var(--muted)">Aucun résultat</p>';$('commandResults').querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{let[id,i]=b.dataset.command.split(':');selectModule(id,+i);closeCommand()})}
function openCommand(){state.search=true;$('commandOverlay').classList.add('open');$('commandInput').value='';commandResults();$('commandInput').focus()}function closeCommand(){state.search=false;$('commandOverlay').classList.remove('open')}
$('edgeTrigger').addEventListener('mouseenter',openDrawer);$('drawer').addEventListener('mouseenter',()=>clearTimeout(window._drawerTimer));$('drawer').addEventListener('mouseleave',()=>{if(innerWidth>740)window._drawerTimer=setTimeout(closeDrawer,350)});$('edgeTrigger').addEventListener('mouseleave',()=>{if(innerWidth>740)window._drawerTimer=setTimeout(closeDrawer,550)});$('closeDrawer').onclick=closeDrawer;$('drawerBackdrop').onclick=closeDrawer;$('menuSearch').oninput=renderDrawer;$('mobileMenu').innerHTML=icon('menu',19);$('mobileMenu').onclick=openDrawer;$('themeToggle').onclick=()=>setTheme(state.theme==='light'?'dark':'light');$('bellButton').innerHTML=icon('bell',19)+'<span class="badge-dot"></span>';$('bellButton').onclick=()=>toast('Notifications : branchement aux données réelles de l’ERP');$('globalSearch').innerHTML=icon('search',19)+'<span>Rechercher...</span><kbd>⌘ K</kbd>';$('globalSearch').onclick=openCommand;$('commandInput').oninput=e=>commandResults(e.target.value);$('closeCommand').onclick=closeCommand;$('commandOverlay').onclick=e=>{if(e.target===$('commandOverlay'))closeCommand()};$('orgButton').onclick=()=>toast('Sélecteur organisation / magasin : préserver le fonctionnement actuel');$('profileButton').onclick=()=>toast('Menu utilisateur : profil, paramètres et déconnexion');$('dateButton').onclick=()=>toast('Date : les métriques actuelles ne prennent pas toutes en charge une période');$('createButton').onclick=()=>toast('Créer : choisir une opération autorisée depuis le menu rapide');$('brandHome').onclick=e=>{e.preventDefault();selectModule('dashboard')};document.addEventListener('click',e=>{if(state.openNavMenu&&!e.target.closest('#contextTabs')){state.openNavMenu=null;renderTabs()}});window.addEventListener('resize',()=>{state.openNavMenu=null;renderTabs()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.openNavMenu=null;renderTabs();closeDrawer();closeCommand()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}});setTheme(state.theme);renderAll();
</script></body></html>
